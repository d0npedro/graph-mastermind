name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  graph-explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: graph-explorer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
